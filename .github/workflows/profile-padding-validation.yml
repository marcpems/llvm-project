name: Profile padding compatibility validation

on:
  workflow_dispatch:
    inputs:
      runners:
        description: JSON array of standard runner labels to validate
        type: string
        default: '["windows-2025","ubuntu-24.04","ubuntu-24.04-arm","macos-15"]'

permissions:
  contents: read

jobs:
  validate:
    uses: marcpems/llvm-project/.github/workflows/profile-padding-ab.yml@validation/profile-padding-ab
    with:
      source_ref: validation/profile-padding-ab
      runners: ${{ inputs.runners }}
