name: Perf - Persistent llc/opt Worker Process (invasive prototype)

# Isolated, deliberately abandonable investigation branch. The workflow
# name stays stable for continuity with the broader investigation, but the
# current branch state is more narrowly an "embed-opt-in-lit" prototype:
# FileCheck-DLL-style in-process opt reuse inside long-lived lit workers,
# not a separate IPC daemon and not a validated llc reuse design.
#
# Runs entirely on GitHub-hosted runners (both Windows and Linux) so
# results are not conflated with any other concurrent local-machine or
# contention-investigation work happening in parallel.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner to use"
        required: true
        type: choice
        options:
          - windows-11-arm
          - windows-latest
          - windows-2022
          - ubuntu-24.04-arm
          - ubuntu-latest
      mode:
        description: "What to validate this run"
        required: true
        type: choice
        options:
          - baseline-only
          - worker-correctness
          - worker-throughput
      test-subset:
        description: "lit test subdirectory to use for validation/benchmarking"
        required: false
        type: string
        default: "CodeGen/X86"
      jobs-count:
        description: "-j value for the lit run(s); default 12 is treated as auto-detect"
        required: false
        type: string
        default: "12"
      reps:
        description: "Number of timed repetitions for throughput mode"
        required: false
        type: string
        default: "3"
  push:
    branches:
      - perf-persistent-worker

permissions:
  contents: read

jobs:
  push-validation:
    name: "Embed-opt push validation on ${{ matrix.runner }}"
    if: github.event_name == 'push' && github.repository_owner == 'marcpems'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: "Setup MSVC environment (Windows only)"
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: "Configure (Windows)"
        if: ${{ runner.os == 'Windows' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Configure (Linux)"
        if: ${{ runner.os == 'Linux' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: Warm build
        run: |
          for attempt in 1 2 3 4 5; do
            if ninja -C build OptEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: Correctness and throughput validation
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          python .github/scripts/embed_opt_validation.py \
            --mode push-validation \
            --lit-bin "$LIT_BIN" \
            --opt-embed "$GITHUB_WORKSPACE/$OPT_EMBED" \
            --test-subset "llvm/test/Transforms/InstCombine" \
            --results-dir results \
            --jobs auto \
            --reps 3

      - name: Report push validation results
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          if not Path("results/correctness_summary.json").exists():
              print("## Embed-opt push validation")
              print()
              print("No validation summary was produced before the job failed.")
              raise SystemExit(0)

          correctness = json.loads(Path("results/correctness_summary.json").read_text(encoding="utf-8"))
          throughput = json.loads(Path("results/throughput_summary.json").read_text(encoding="utf-8"))
          print("## Embed-opt push validation")
          print()
          print("Current branch prototype: `embed-opt-in-lit` (FileCheck-DLL-for-opt), not a persistent llc worker.")
          print()
          print(f"Runner: `${{ matrix.runner }}`, subset: `Transforms/InstCombine`, -j: `{correctness['jobs']}`")
          print()
          print("```")
          print(Path("results/correctness_summary.txt").read_text(encoding="utf-8"), end="")
          print("```")
          print()
          print("| ABBA quartet | Baseline mean (s) | Worker mean (s) | Delta (s) |")
          print("|---|---:|---:|---:|")
          for quartet in throughput["quartets"]:
              baseline = [run["elapsed"] for run in quartet["runs"] if run["kind"] == "baseline"]
              worker = [run["elapsed"] for run in quartet["runs"] if run["kind"] == "worker"]
              baseline_mean = sum(baseline) / len(baseline)
              worker_mean = sum(worker) / len(worker)
              print(
                  f"| {quartet['rep']} | {baseline_mean:.6f} | {worker_mean:.6f} | "
                  f"{worker_mean - baseline_mean:.6f} |"
              )
          print()
          print("| Summary | Baseline (s) | Worker (s) | Delta (s) |")
          print("|---|---:|---:|---:|")
          summary = throughput["summary"]
          print(f"| Mean | {summary['baseline_mean']:.6f} | {summary['worker_mean']:.6f} | {summary['delta_mean']:.6f} |")
          print(f"| Stdev | {summary['baseline_stdev']:.6f} | {summary['worker_stdev']:.6f} | n/a |")
          print(
              f"| Range | {summary['baseline_range'][0]:.6f}..{summary['baseline_range'][1]:.6f} | "
              f"{summary['worker_range'][0]:.6f}..{summary['worker_range'][1]:.6f} | n/a |"
          )
          PY

      - name: Upload push validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-worker-push-${{ matrix.runner }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  persistent-worker-test:
    name: "Embed-opt / persistent-worker branch: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'n/a' }} on ${{ github.event_name == 'workflow_dispatch' && inputs.runs-on || 'ubuntu-latest' }}"
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'marcpems'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: "Setup MSVC environment (Windows only)"
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: "Configure (Windows)"
        if: ${{ runner.os == 'Windows' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Configure (Linux)"
        if: ${{ runner.os == 'Linux' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Warm build (not timed) -- builds the current embed-opt prototype"
        run: |
          for attempt in 1 2 3 4 5; do
            if ninja -C build OptEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: "Warm test run (not timed)"
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          JOBS="${{ inputs.jobs-count }}"
          if [ -z "$JOBS" ] || [ "$JOBS" = "12" ]; then
            JOBS=$(python -c "import os; print(os.cpu_count() or 1)")
          fi
          "$LIT_BIN" -j "$JOBS" -q "llvm/test/${{ inputs.test-subset }}" || true

      - name: "Mode: baseline-only (establish current-process-per-invocation timing, no worker involved)"
        if: ${{ inputs.mode == 'baseline-only' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          python .github/scripts/embed_opt_validation.py \
            --mode baseline-only \
            --lit-bin "$LIT_BIN" \
            --test-subset "llvm/test/${{ inputs.test-subset }}" \
            --results-dir results \
            --jobs "${{ inputs.jobs-count }}" \
            --reps "${{ inputs.reps }}"

      - name: "Mode: worker-correctness (current branch prototype: embed-opt-in-lit)"
        if: ${{ inputs.mode == 'worker-correctness' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          python .github/scripts/embed_opt_validation.py \
            --mode worker-correctness \
            --lit-bin "$LIT_BIN" \
            --opt-embed "$GITHUB_WORKSPACE/$OPT_EMBED" \
            --test-subset "llvm/test/${{ inputs.test-subset }}" \
            --results-dir results \
            --jobs "${{ inputs.jobs-count }}"

      - name: "Mode: worker-throughput (current branch prototype: embed-opt-in-lit)"
        if: ${{ inputs.mode == 'worker-throughput' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          python .github/scripts/embed_opt_validation.py \
            --mode worker-throughput \
            --lit-bin "$LIT_BIN" \
            --opt-embed "$GITHUB_WORKSPACE/$OPT_EMBED" \
            --test-subset "llvm/test/${{ inputs.test-subset }}" \
            --results-dir results \
            --jobs "${{ inputs.jobs-count }}" \
            --reps "${{ inputs.reps }}"

      - name: Report results
        if: ${{ always() && inputs.mode == 'baseline-only' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          if not Path("results/baseline_summary.json").exists():
              print("## Embed-opt branch baseline-only")
              print()
              print("No baseline summary was produced before the job failed.")
              raise SystemExit(0)

          summary = json.loads(Path("results/baseline_summary.json").read_text(encoding="utf-8"))
          print("## Embed-opt branch baseline-only")
          print()
          print("Current branch prototype: `embed-opt-in-lit` (FileCheck-DLL-for-opt), not a persistent llc worker.")
          print()
          print(f"Runner: `${{ inputs.runs-on }}`, test subset: `${{ inputs.test-subset }}`, -j: `{summary['jobs']}`")
          print()
          print("| Rep | Wall time (s) | Return code |")
          print("|---|---:|---:|")
          for run in summary["runs"]:
              print(f"| {run['rep']} | {run['elapsed']:.6f} | {run['returncode']} |")
          print()
          print(f"Mean: `{summary['mean']:.6f}` s, stdev: `{summary['stdev']:.6f}` s, range: `{summary['range'][0]:.6f}`..`{summary['range'][1]:.6f}` s")
          PY

      - name: Report correctness results
        if: ${{ always() && inputs.mode == 'worker-correctness' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          if not Path("results/correctness_summary.json").exists():
              print("## Embed-opt correctness")
              print()
              print("No correctness summary was produced before the job failed.")
              raise SystemExit(0)

          summary = json.loads(Path("results/correctness_summary.json").read_text(encoding="utf-8"))
          print("## Embed-opt correctness")
          print()
          print("Current branch prototype: `embed-opt-in-lit` (FileCheck-DLL-for-opt), not a persistent llc worker.")
          print()
          print(f"Runner: `${{ inputs.runs-on }}`, test subset: `${{ inputs.test-subset }}`, -j: `{summary['jobs']}`")
          print()
          print("```")
          print(Path("results/correctness_summary.txt").read_text(encoding="utf-8"), end="")
          print("```")
          PY

      - name: Report throughput results
        if: ${{ always() && inputs.mode == 'worker-throughput' }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          if not Path("results/throughput_summary.json").exists():
              print("## Embed-opt throughput")
              print()
              print("No throughput summary was produced before the job failed.")
              raise SystemExit(0)

          throughput = json.loads(Path("results/throughput_summary.json").read_text(encoding="utf-8"))
          print("## Embed-opt throughput")
          print()
          print("Current branch prototype: `embed-opt-in-lit` (FileCheck-DLL-for-opt), not a persistent llc worker.")
          print()
          print(f"Runner: `${{ inputs.runs-on }}`, test subset: `${{ inputs.test-subset }}`, -j: `{throughput['jobs']}`")
          print()
          print("| ABBA quartet | Baseline mean (s) | Worker mean (s) | Delta (s) |")
          print("|---|---:|---:|---:|")
          for quartet in throughput["quartets"]:
              baseline = [run["elapsed"] for run in quartet["runs"] if run["kind"] == "baseline"]
              worker = [run["elapsed"] for run in quartet["runs"] if run["kind"] == "worker"]
              baseline_mean = sum(baseline) / len(baseline)
              worker_mean = sum(worker) / len(worker)
              print(
                  f"| {quartet['rep']} | {baseline_mean:.6f} | {worker_mean:.6f} | "
                  f"{worker_mean - baseline_mean:.6f} |"
              )
          print()
          summary = throughput["summary"]
          print(
              f"Mean baseline `{summary['baseline_mean']:.6f}` s, stdev `{summary['baseline_stdev']:.6f}` s, "
              f"range `{summary['baseline_range'][0]:.6f}`..`{summary['baseline_range'][1]:.6f}` s"
          )
          print()
          print(
              f"Mean worker `{summary['worker_mean']:.6f}` s, stdev `{summary['worker_stdev']:.6f}` s, "
              f"range `{summary['worker_range'][0]:.6f}`..`{summary['worker_range'][1]:.6f}` s"
          )
          print()
          print(f"Mean delta `{summary['delta_mean']:.6f}` s")
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-worker-results-${{ inputs.mode }}-${{ inputs.runs-on }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
