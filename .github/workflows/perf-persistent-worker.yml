name: Perf - Persistent llc/opt Worker Process (invasive prototype)

# Isolated, deliberately abandonable investigation branch: prototype a
# persistent, long-lived "worker" process that services MANY llc/opt
# invocations via lightweight IPC instead of one process-create per
# invocation (generalizing the earlier in-process FileCheck DLL idea to
# the two heaviest, most-frequently-spawned CodeGen/Transforms tools).
# This is explicitly the most invasive lever identified in the wider
# investigation (see perf-review-notes.md, "llc/opt persistent-worker
# feasibility check" section) -- kept on its own branch
# (perf-persistent-worker) so it can be discarded without touching the
# already-verified, already-committed test-consolidation work on
# perf-test-consolidation-x86.
#
# Runs entirely on GitHub-hosted runners (both Windows and Linux) so
# results are not conflated with any other concurrent local-machine or
# contention-investigation work happening in parallel.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner to use"
        required: true
        type: choice
        options:
          - windows-11-arm
          - windows-latest
          - windows-2022
          - ubuntu-24.04-arm
          - ubuntu-latest
      mode:
        description: "What to validate this run"
        required: true
        type: choice
        options:
          - baseline-only
          - worker-correctness
          - worker-throughput
      test-subset:
        description: "lit test subdirectory to use for validation/benchmarking"
        required: false
        type: string
        default: "CodeGen/X86"
      jobs-count:
        description: "-j value for the lit run(s)"
        required: false
        type: string
        default: "12"
      reps:
        description: "Number of timed repetitions for throughput mode"
        required: false
        type: string
        default: "3"
  push:
    branches:
      - perf-persistent-worker

permissions:
  contents: read

jobs:
  push-validation:
    name: "Persistent worker push validation on ${{ matrix.runner }}"
    if: github.event_name == 'push' && github.repository_owner == 'marcpems'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: "Setup MSVC environment (Windows only)"
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: "Configure (Windows)"
        if: ${{ runner.os == 'Windows' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Configure (Linux)"
        if: ${{ runner.os == 'Linux' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: Warm build
        run: |
          for attempt in 1 2 3 4 5; do
            if ninja -C build OptEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: Correctness and throughput validation
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          mkdir -p results

          TEST_SUBSET="llvm/test/Transforms/InstCombine"
          JOBS=12
          REPS=3

          "$LIT_BIN" -j "$JOBS" -q "$TEST_SUBSET" || true
          "$LIT_BIN" -j "$JOBS" -q -o "results/correctness_baseline.json" "$TEST_SUBSET" || true
          LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "$JOBS" -q -o "results/correctness_worker.json" "$TEST_SUBSET" || true
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          def load(path):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              tests = data.get("tests", [])
              return data, {t["name"]: t["code"] for t in tests}

          baseline_data, baseline = load("results/correctness_baseline.json")
          worker_data, worker = load("results/correctness_worker.json")
          if set(baseline) != set(worker):
              print("Discovered-test set mismatch.")
              print("Missing from worker:", sorted(set(baseline) - set(worker))[:50])
              print("Extra in worker:", sorted(set(worker) - set(baseline))[:50])
              sys.exit(1)

          mismatches = [
              (name, baseline[name], worker[name])
              for name in sorted(baseline)
              if baseline[name] != worker[name]
          ]
          if mismatches:
              print("Pass/fail mismatches detected (showing first 50):")
              for entry in mismatches[:50]:
                  print(entry)
              sys.exit(1)

          Path("results/correctness_summary.txt").write_text(
              "tests=%d\nbaseline_counts=%s\nworker_counts=%s\n"
              % (
                  len(baseline),
                  baseline_data.get("tests_by_code", {}),
                  worker_data.get("tests_by_code", {}),
              ),
              encoding="utf-8",
          )
          PY

          LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "$JOBS" -q "$TEST_SUBSET" || true
          printf "rep\tbaseline\tworker\n" > results/throughput.tsv
          for i in $(seq 1 "$REPS"); do
            start=$(date +%s.%N)
            "$LIT_BIN" -j "$JOBS" -q -o "results/throughput_baseline_rep${i}.json" "$TEST_SUBSET" || true
            end=$(date +%s.%N)
            baseline=$(echo "$end - $start" | bc)

            start=$(date +%s.%N)
            LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "$JOBS" -q -o "results/throughput_worker_rep${i}.json" "$TEST_SUBSET" || true
            end=$(date +%s.%N)
            worker=$(echo "$end - $start" | bc)

            printf "%s\t%s\t%s\n" "$i" "$baseline" "$worker" >> results/throughput.tsv
          done

      - name: Report push validation results
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import statistics
          from pathlib import Path

          correctness = Path("results/correctness_summary.txt").read_text(encoding="utf-8")
          rows = []
          with Path("results/throughput.tsv").open(encoding="utf-8") as f:
              next(f)
              for line in f:
                  rep, baseline, worker = line.rstrip().split("\t")
                  rows.append((int(rep), float(baseline), float(worker)))

          baselines = [row[1] for row in rows]
          workers = [row[2] for row in rows]
          print("## Persistent worker push validation")
          print()
          print("Runner: `${{ matrix.runner }}`, subset: `Transforms/InstCombine`, -j: `12`")
          print()
          print("```")
          print(correctness, end="")
          print("```")
          print()
          print("| Rep | Baseline (s) | Worker (s) | Delta (s) |")
          print("|---|---:|---:|---:|")
          for rep, baseline, worker in rows:
              print(f"| {rep} | {baseline:.6f} | {worker:.6f} | {worker - baseline:.6f} |")
          print()
          print("| Summary | Baseline (s) | Worker (s) | Delta (s) |")
          print("|---|---:|---:|---:|")
          print(
              f"| Mean | {statistics.mean(baselines):.6f} | {statistics.mean(workers):.6f} | "
              f"{statistics.mean(workers) - statistics.mean(baselines):.6f} |"
          )
          PY

      - name: Upload push validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-worker-push-${{ matrix.runner }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14

  persistent-worker-test:
    name: "Persistent worker: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'n/a' }} on ${{ github.event_name == 'workflow_dispatch' && inputs.runs-on || 'ubuntu-latest' }}"
    if: github.event_name == 'workflow_dispatch' && github.repository_owner == 'marcpems'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runs-on || 'ubuntu-latest' }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: "Setup MSVC environment (Windows only)"
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: "Configure (Windows)"
        if: ${{ runner.os == 'Windows' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Configure (Linux)"
        if: ${{ runner.os == 'Linux' }}
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Warm build (not timed) -- also builds the persistent-worker prototype target once it exists"
        run: |
          for attempt in 1 2 3 4 5; do
            if ninja -C build OptEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: "Warm test run (not timed)"
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q "llvm/test/${{ inputs.test-subset }}" || true

      - name: "Mode: baseline-only (establish current-process-per-invocation timing, no worker involved)"
        if: ${{ inputs.mode == 'baseline-only' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          mkdir -p results
          for i in $(seq 1 "${{ inputs.reps }}"); do
            start=$(date +%s.%N)
            "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q -o "results/baseline_rep${i}.json" "llvm/test/${{ inputs.test-subset }}" || true
            end=$(date +%s.%N)
            echo "BASELINE_${i}_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
          done

      - name: "Mode: worker-correctness (placeholder -- implementing agent: wire up the actual persistent-worker lit hook here, mirroring LIT_FILECHECK_DLL's env-var-triggered opt-in pattern, and assert zero regressions vs baseline)"
        if: ${{ inputs.mode == 'worker-correctness' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          mkdir -p results
          "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q -o "results/correctness_baseline.json" "llvm/test/${{ inputs.test-subset }}" || true
          LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q -o "results/correctness_worker.json" "llvm/test/${{ inputs.test-subset }}" || true
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          def load(path):
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              tests = data.get("tests", [])
              return data, {t["name"]: t["code"] for t in tests}

          baseline_data, baseline = load("results/correctness_baseline.json")
          worker_data, worker = load("results/correctness_worker.json")

          baseline_names = set(baseline)
          worker_names = set(worker)
          if baseline_names != worker_names:
              print("Discovered-test set mismatch.")
              print("Missing from worker:", sorted(baseline_names - worker_names)[:50])
              print("Extra in worker:", sorted(worker_names - baseline_names)[:50])
              sys.exit(1)

          mismatches = [
              (name, baseline[name], worker[name])
              for name in sorted(baseline_names)
              if baseline[name] != worker[name]
          ]
          if mismatches:
              print("Pass/fail mismatches detected (showing first 50):")
              for entry in mismatches[:50]:
                  print(entry)
              sys.exit(1)

          Path("results/correctness_summary.txt").write_text(
              "tests=%d\nbaseline_counts=%s\nworker_counts=%s\n"
              % (
                  len(baseline),
                  baseline_data.get("tests_by_code", {}),
                  worker_data.get("tests_by_code", {}),
              ),
              encoding="utf-8",
          )
          print("Correctness matched for", len(baseline), "tests")
          PY

      - name: "Mode: worker-throughput (placeholder -- implementing agent: wire up timed reps analogous to baseline-only, but routed through the worker path)"
        if: ${{ inputs.mode == 'worker-throughput' }}
        run: |
          LIT_BIN="build/bin/llvm-lit"
          [ -f "build/bin/llvm-lit.exe" ] && LIT_BIN="build/bin/llvm-lit.exe"
          OPT_EMBED="build/lib/libOptEmbedCLI.so"
          [ -f "build/bin/OptEmbedCLI.dll" ] && OPT_EMBED="build/bin/OptEmbedCLI.dll"
          [ -f "build/bin/libOptEmbedCLI.so" ] && OPT_EMBED="build/bin/libOptEmbedCLI.so"
          mkdir -p results
          LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q "llvm/test/${{ inputs.test-subset }}" || true
          for i in $(seq 1 "${{ inputs.reps }}"); do
            start=$(date +%s.%N)
            "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q -o "results/throughput_baseline_rep${i}.json" "llvm/test/${{ inputs.test-subset }}" || true
            end=$(date +%s.%N)
            echo "BASELINE_${i}_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"

            start=$(date +%s.%N)
            LIT_OPT_DLL="$GITHUB_WORKSPACE/$OPT_EMBED" "$LIT_BIN" -j "${{ inputs.jobs-count }}" -q -o "results/throughput_worker_rep${i}.json" "llvm/test/${{ inputs.test-subset }}" || true
            end=$(date +%s.%N)
            echo "WORKER_${i}_SECONDS=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
          done

      - name: Report results
        if: ${{ inputs.mode == 'baseline-only' }}
        shell: bash
        run: |
          {
            echo "## Persistent worker investigation: ${{ inputs.mode }}"
            echo ""
            echo "Runner: \`${{ inputs.runs-on }}\`, test subset: \`${{ inputs.test-subset }}\`, -j: \`${{ inputs.jobs-count }}\`"
            echo ""
            echo "| Rep | Wall time (s) |"
            echo "|---|---|"
            for i in $(seq 1 "${{ inputs.reps }}"); do
              varname="BASELINE_${i}_SECONDS"
              echo "| $i | ${!varname} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report correctness results
        if: ${{ inputs.mode == 'worker-correctness' }}
        shell: bash
        run: |
          {
            echo "## Persistent worker investigation: ${{ inputs.mode }}"
            echo ""
            echo "Runner: \`${{ inputs.runs-on }}\`, test subset: \`${{ inputs.test-subset }}\`, -j: \`${{ inputs.jobs-count }}\`"
            echo ""
            echo "\`\`\`"
            cat results/correctness_summary.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report throughput results
        if: ${{ inputs.mode == 'worker-throughput' }}
        shell: bash
        run: |
          {
            echo "## Persistent worker investigation: ${{ inputs.mode }}"
            echo ""
            echo "Runner: \`${{ inputs.runs-on }}\`, test subset: \`${{ inputs.test-subset }}\`, -j: \`${{ inputs.jobs-count }}\`"
            echo ""
            echo "| Rep | Baseline (s) | Worker (s) | Delta (s) |"
            echo "|---|---:|---:|---:|"
            for i in $(seq 1 "${{ inputs.reps }}"); do
              base_var="BASELINE_${i}_SECONDS"
              worker_var="WORKER_${i}_SECONDS"
              delta=$(python - <<PY
base=float("${!base_var}")
worker=float("${!worker_var}")
print(f"{worker-base:.6f}")
PY
)
              echo "| $i | ${!base_var} | ${!worker_var} | $delta |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: persistent-worker-results-${{ inputs.mode }}-${{ inputs.runs-on }}
          path: results/
          if-no-files-found: ignore
          retention-days: 14
