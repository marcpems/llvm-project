name: Repro ThinLTO link failure

on:
  push:
    branches: [gb300-validation-overlay]
    paths: [".github/workflows/repro-thinlto-link.yml"]

env:
  LINK_JOBS: "16"
  CLEAR_CACHE: "true"
  RESTORE_FROM_BACKUP: "true"

jobs:
  repro:
    runs-on: [self-hosted, Windows, X64, marcpe-db1]
    steps:
      - name: Restore build dir from backup (if requested)
        if: ${{ env.RESTORE_FROM_BACKUP == 'true' }}
        shell: cmd
        run: |
          robocopy "C:\llvm-repro-backup\build_amd64" "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64" /MIR /MT:32 /R:1 /W:1 /NFL /NDL
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Clear LTO cache (if requested)
        if: ${{ env.CLEAR_CACHE == 'true' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64\lto.cache" -ErrorAction SilentlyContinue
          Remove-Item -Force "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64\bin\clang.exe" -ErrorAction SilentlyContinue

      - name: Relink bin/clang.exe WHILE a targeted Defender scan runs concurrently
        shell: pwsh
        run: |
          $buildDir = "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64"
          $vsdevcmd = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat"
          $ninja = "C:\Users\marcpe\AppData\Local\Microsoft\WinGet\Links\ninja.exe"

          Write-Output "Starting concurrent CustomScan targeting $buildDir ..."
          $scanJob = Start-Job -ScriptBlock {
            param($p)
            try { Start-MpScan -ScanType CustomScan -ScanPath $p } catch { Write-Output "Scan error: $_" }
          } -ArgumentList $buildDir

          Start-Sleep -Seconds 2  # let the scan actually begin touching files first

          $cmdLine = "call `"$vsdevcmd`" -arch=x64 && cd /d `"$buildDir`" && `"$ninja`" -j$env:LINK_JOBS bin/clang.exe"
          Write-Output "Launching relink: $cmdLine"
          $p = Start-Process -FilePath "$env:ComSpec" -ArgumentList "/c", $cmdLine -NoNewWindow -PassThru -Wait
          $exitCode = $p.ExitCode
          Write-Output "Ninja relink exit code: $exitCode"

          Write-Output "Stopping/cleaning up scan job..."
          Stop-Job -Job $scanJob -ErrorAction SilentlyContinue
          Receive-Job -Job $scanJob -ErrorAction SilentlyContinue
          Remove-Job -Job $scanJob -Force -ErrorAction SilentlyContinue
          Get-Process -Name MpCmdRun -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          if ($exitCode -ne 0) { exit 1 }
# repro run 2
