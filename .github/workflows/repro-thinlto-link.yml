name: Repro ThinLTO link failure

on:
  workflow_dispatch:
    inputs:
      link_jobs:
        description: "ninja -j value for the relink step"
        default: "16"
      clear_cache:
        description: "Clear ThinLTO cache before relink (cold-cache, realistic repro)"
        type: boolean
        default: true
      restore_from_backup:
        description: "Restore build_amd64 from the pinned failed-build backup before relinking"
        type: boolean
        default: true

jobs:
  repro:
    runs-on: [self-hosted, Windows, X64, marcpe-db1]
    steps:
      - name: Restore build dir from backup (if requested)
        if: ${{ inputs.restore_from_backup == 'true' }}
        shell: cmd
        run: |
          robocopy "C:\llvm-repro-backup\build_amd64" "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64" /MIR /MT:32 /R:1 /W:1 /NFL /NDL
          if %ERRORLEVEL% GEQ 8 exit /b 1
          exit /b 0

      - name: Clear LTO cache (if requested)
        if: ${{ inputs.clear_cache == 'true' }}
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64\lto.cache" -ErrorAction SilentlyContinue
          Remove-Item -Force "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64\bin\clang.exe" -ErrorAction SilentlyContinue

      - name: Relink bin/clang.exe via real runner job context
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd /d "S:\llvm\utils\release\llvm_package_24.0.0\build_amd64"
          C:\Users\marcpe\AppData\Local\Microsoft\WinGet\Links\ninja.exe -j${{ inputs.link_jobs }} bin/clang.exe
          exit /b %ERRORLEVEL%
