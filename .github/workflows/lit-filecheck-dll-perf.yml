name: Lit In-Process FileCheck DLL Perf Test

# Dedicated, self-contained A/B perf test for the in-process FileCheck DLL
# work (see marcpems/llvm-win-wsl-perf-bench and
# lit/builtin_commands/filecheck_dll.py). Deliberately does NOT reuse or
# modify release-binaries.yml's production release build/package pipeline;
# it does a plain, non-bootstrap `ninja check-llvm` build/test run on a
# chosen Windows runner, twice in a row against the exact same already-built
# binaries (so the timing difference is purely lit's own wall-clock
# behavior, not compile time): once with FileCheck spawned as an external
# process per RUN line (today's behavior), and once with LIT_FILECHECK_DLL
# pointing at the FileCheckEmbedCLI.dll built alongside it, so lit calls the
# same FileCheck engine in-process via ctypes instead.
#
# Includes both self-hosted GB300 runners and standard GitHub-hosted
# windows-11-arm/windows-latest runners so results can be compared across
# runner types, not just against the GB300 hardware.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner to use"
        required: true
        type: choice
        options:
          - gb300-hive102
          - gb300-kmelmon
          - windows-11-arm
          - windows-latest
          - windows-2022

permissions:
  contents: read

jobs:
  perf-test:
    name: "check-llvm A/B: external FileCheck.exe vs in-process DLL"
    if: github.repository_owner == 'marcpems'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      # Without this, `cmake -G Ninja` running from bash on a GitHub-hosted
      # Windows runner auto-detects whatever cc/c++ it finds first on PATH,
      # which is MinGW GCC from Git for Windows' bundled /mingw64/bin (found
      # ahead of MSVC because we never load vcvars) rather than MSVC. That
      # produced a MinGW-linked llvm-min-tblgen.exe (importing
      # libstdc++-6.dll / libgcc_s_seh-1.dll / libwinpthread-1.dll instead of
      # MSVC's CRT), and a mismatched/updated copy of one of those MinGW
      # runtime DLLs on the current runner image is what's most likely
      # causing STATUS_ENTRYPOINT_NOT_FOUND. Explicitly set up the MSVC dev
      # environment so CMake picks up cl.exe instead, matching the known-good
      # local (clang-cl/MSVC) toolchain.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER=cl \
            -DCMAKE_CXX_COMPILER=cl \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Warm build (compile everything check-llvm needs, plus the DLL; not timed)"
        run: |
          # GitHub-hosted Windows runners have a confirmed, currently-open
          # runner-images regression (actions/runner-images#14715) in the
          # same failure-mode family: a system DLL earlier on PATH shadows
          # one our freshly-linked tool needs, with an incompatible newer
          # version missing expected exports, causing
          # STATUS_ENTRYPOINT_NOT_FOUND (exit 3221225785) immediately after
          # linking -- most often hit on llvm-min-tblgen.exe when
          # generating *TargetParserDef.inc. GitHub's own repro of that
          # issue pinned it on a stale re2.dll shipped by a Service Fabric
          # folder on PATH, but llvm-min-tblgen.exe doesn't link re2, so
          # our exact culprit DLL is still unconfirmed. Print PE import
          # diagnostics on first failure to identify it.
          for attempt in 1 2 3 4 5; do
            if ninja -C build FileCheckEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            if [ "$attempt" = "1" ] && [ -f build/bin/llvm-min-tblgen.exe ]; then
              echo "--- Diagnostics: llvm-min-tblgen.exe import table ---"
              DUMPBIN=$(find "/c/Program Files/Microsoft Visual Studio" -iname "dumpbin.exe" 2>/dev/null | grep -i "Hostx64/x64" | head -1)
              if [ -n "$DUMPBIN" ]; then
                # MSYS bash mangles a leading "/xxx" as a unix-style path
                # and rewrites it to a bogus Windows path (e.g.
                # "/dependents" -> "C:\Program Files\Git\dependents"),
                # silently breaking the /dependents switch. MSYS_NO_PATHCONV
                # disables that rewriting for this command only.
                MSYS_NO_PATHCONV=1 "$DUMPBIN" /dependents build/bin/llvm-min-tblgen.exe || true
              else
                echo "dumpbin.exe not found on this image"
              fi
              echo "--- Diagnostics: PATH entries ---"
              echo "$PATH" | tr ':' '\n'
            fi
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: "Warm test run (first check-llvm lit run; not timed, expected to have some pre-existing failures since we only build the X86 target)"
        run: |
          # We only build LLVM_TARGETS_TO_BUILD=X86, so some lit tests that
          # need other backends legitimately fail (e.g. "unable to get
          # target for ''"). That's unrelated to the FileCheck DLL change
          # we're measuring, so don't treat a non-zero check-llvm exit as
          # fatal here or in the timed runs below; we only care about wall
          # clock time, and both timed runs share the exact same set of
          # failures so the comparison stays apples-to-apples.
          ninja -C build check-llvm || true

      # ABBA design (Baseline, In-process, In-process, Baseline): every prior
      # A/B run in this investigation always ran Baseline first and
      # In-process second, with no control for run-order effects (thermal
      # ramp, VM noisy-neighbor drift, disk/page-cache state accumulating
      # over a long CI job). A controlled microbenchmark later showed
      # in-process FileCheck should be *faster*, directly contradicting the
      # observed full-suite regression -- so this ABBA ordering exists
      # specifically to separate a genuine mode effect from a position
      # effect. If "whichever mode runs second is slower" regardless of
      # which mode that is, the earlier regression was a measurement
      # artifact, not a real property of the in-process approach.
      - name: "Run 1/4: Baseline (A)"
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "BASELINE_1_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: "Run 2/4: In-process (B)"
        env:
          LIT_FILECHECK_DLL: ${{ github.workspace }}/build/bin/FileCheckEmbedCLI.dll
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "INPROC_1_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: "Run 3/4: In-process (B)"
        env:
          LIT_FILECHECK_DLL: ${{ github.workspace }}/build/bin/FileCheckEmbedCLI.dll
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "INPROC_2_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: "Run 4/4: Baseline (A)"
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "BASELINE_2_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Report results
        run: |
          BASELINE_AVG=$(( (BASELINE_1_SECONDS + BASELINE_2_SECONDS) / 2 ))
          INPROC_AVG=$(( (INPROC_1_SECONDS + INPROC_2_SECONDS) / 2 ))
          {
            echo "## Lit in-process FileCheck DLL perf test (ABBA order-controlled)"
            echo ""
            echo "Suite: \`check-llvm\` on \`${{ inputs.runs-on }}\`"
            echo ""
            echo "| Run order | Mode | Wall time (s) |"
            echo "|---|------|----------------|"
            echo "| 1 (A) | Baseline (external FileCheck.exe) | ${BASELINE_1_SECONDS} |"
            echo "| 2 (B) | In-process (ctypes FileCheckMain DLL) | ${INPROC_1_SECONDS} |"
            echo "| 3 (B) | In-process (ctypes FileCheckMain DLL) | ${INPROC_2_SECONDS} |"
            echo "| 4 (A) | Baseline (external FileCheck.exe) | ${BASELINE_2_SECONDS} |"
            echo ""
            echo "| Summary | Value |"
            echo "|---|---|"
            echo "| Baseline average (runs 1+4) | ${BASELINE_AVG}s |"
            echo "| In-process average (runs 2+3) | ${INPROC_AVG}s |"
            echo "| Baseline drift (run4 - run1) | $((BASELINE_2_SECONDS - BASELINE_1_SECONDS))s |"
            echo "| In-process drift (run3 - run2) | $((INPROC_2_SECONDS - INPROC_1_SECONDS))s |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline runs:   ${BASELINE_1_SECONDS}s, ${BASELINE_2_SECONDS}s (avg ${BASELINE_AVG}s)"
          echo "In-process runs: ${INPROC_1_SECONDS}s, ${INPROC_2_SECONDS}s (avg ${INPROC_AVG}s)"
