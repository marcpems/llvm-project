name: Lit In-Process FileCheck DLL Perf Test

# Dedicated, self-contained A/B perf test for the in-process FileCheck DLL
# work (see marcpems/llvm-win-wsl-perf-bench and
# lit/builtin_commands/filecheck_dll.py). Deliberately does NOT reuse or
# modify release-binaries.yml's production release build/package pipeline;
# it does a plain, non-bootstrap `ninja check-llvm` build/test run on a
# chosen Windows runner, twice in a row against the exact same already-built
# binaries (so the timing difference is purely lit's own wall-clock
# behavior, not compile time): once with FileCheck spawned as an external
# process per RUN line (today's behavior), and once with LIT_FILECHECK_DLL
# pointing at the FileCheckEmbedCLI.dll built alongside it, so lit calls the
# same FileCheck engine in-process via ctypes instead.
#
# Includes both self-hosted GB300 runners and standard GitHub-hosted
# windows-11-arm/windows-latest runners so results can be compared across
# runner types, not just against the GB300 hardware.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "Runner to use"
        required: true
        type: choice
        options:
          - gb300-hive102
          - gb300-kmelmon
          - windows-11-arm
          - windows-latest
          - windows-2022

permissions:
  contents: read

jobs:
  perf-test:
    name: "check-llvm A/B: external FileCheck.exe vs in-process DLL"
    if: github.repository_owner == 'marcpems'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LLVM
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.6'

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_APPEND_VC_REV=OFF

      - name: "Warm build (compile everything check-llvm needs, plus the DLL; not timed)"
        run: |
          # GitHub-hosted Windows runners have a confirmed, currently-open
          # runner-images regression (actions/runner-images#14715) in the
          # same failure-mode family: a system DLL earlier on PATH shadows
          # one our freshly-linked tool needs, with an incompatible newer
          # version missing expected exports, causing
          # STATUS_ENTRYPOINT_NOT_FOUND (exit 3221225785) immediately after
          # linking -- most often hit on llvm-min-tblgen.exe when
          # generating *TargetParserDef.inc. GitHub's own repro of that
          # issue pinned it on a stale re2.dll shipped by a Service Fabric
          # folder on PATH, but llvm-min-tblgen.exe doesn't link re2, so
          # our exact culprit DLL is still unconfirmed. Print PE import
          # diagnostics on first failure to identify it.
          for attempt in 1 2 3 4 5; do
            if ninja -C build FileCheckEmbedCLI llvm-test-depends; then
              break
            fi
            echo "Warm build attempt $attempt failed, retrying in 10s..."
            if [ "$attempt" = "1" ] && [ -f build/bin/llvm-min-tblgen.exe ]; then
              echo "--- Diagnostics: llvm-min-tblgen.exe import table ---"
              DUMPBIN=$(find "/c/Program Files/Microsoft Visual Studio" -iname "dumpbin.exe" 2>/dev/null | grep -i "Hostx64/x64" | head -1)
              if [ -n "$DUMPBIN" ]; then
                # MSYS bash mangles a leading "/xxx" as a unix-style path
                # and rewrites it to a bogus Windows path (e.g.
                # "/dependents" -> "C:\Program Files\Git\dependents"),
                # silently breaking the /dependents switch. MSYS_NO_PATHCONV
                # disables that rewriting for this command only.
                MSYS_NO_PATHCONV=1 "$DUMPBIN" /dependents build/bin/llvm-min-tblgen.exe || true
              else
                echo "dumpbin.exe not found on this image"
              fi
              echo "--- Diagnostics: PATH entries ---"
              echo "$PATH" | tr ':' '\n'
            fi
            sleep 10
            if [ "$attempt" = "5" ]; then
              echo "Warm build failed after $attempt attempts"
              exit 1
            fi
          done

      - name: "Warm test run (first check-llvm lit run; not timed, expected to have some pre-existing failures since we only build the X86 target)"
        run: |
          # We only build LLVM_TARGETS_TO_BUILD=X86, so some lit tests that
          # need other backends legitimately fail (e.g. "unable to get
          # target for ''"). That's unrelated to the FileCheck DLL change
          # we're measuring, so don't treat a non-zero check-llvm exit as
          # fatal here or in the timed runs below; we only care about wall
          # clock time, and both timed runs share the exact same set of
          # failures so the comparison stays apples-to-apples.
          ninja -C build check-llvm || true

      - name: "Baseline: check-llvm with external FileCheck.exe per RUN line"
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "BASELINE_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: "In-process: check-llvm via ctypes FileCheckMain DLL"
        env:
          LIT_FILECHECK_DLL: ${{ github.workspace }}/build/bin/FileCheckEmbedCLI.dll
        run: |
          start=$(date +%s)
          ninja -C build check-llvm || true
          end=$(date +%s)
          echo "INPROC_SECONDS=$((end - start))" >> "$GITHUB_ENV"

      - name: Report results
        run: |
          {
            echo "## Lit in-process FileCheck DLL perf test"
            echo ""
            echo "Suite: \`check-llvm\` on \`${{ inputs.runs-on }}\`"
            echo ""
            echo "| Mode | Wall time (s) |"
            echo "|------|----------------|"
            echo "| Baseline (external FileCheck.exe per RUN line) | ${BASELINE_SECONDS} |"
            echo "| In-process (ctypes FileCheckMain DLL, LIT_FILECHECK_DLL set) | ${INPROC_SECONDS} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline:   ${BASELINE_SECONDS}s"
          echo "In-process: ${INPROC_SECONDS}s"
